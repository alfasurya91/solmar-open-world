<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e161c">
  <meta name="description" content="Solmar: a small open-world city by the sea, drawn in 2D and driven from the keyboard.">
  <title>Solmar</title>
  <style>
    /* The page is nothing but a frame for the canvas: no scrollbars, no selection, no tap highlight. */
    :root {
      --ink: #f7f1e2;
      --muted: #a9b3b8;
      --backdrop: #0b1116;
      --edge: rgba(255, 248, 230, 0.12);
      --gold: #f2c75c;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: radial-gradient(circle at 50% 42%, #16232c 0%, var(--backdrop) 72%);
      color: var(--ink);
      font-family: var(--font);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* The canvas keeps the game's own 16:9 shape: `width/height: auto` plus a max on both axes
       preserves the bitmap's aspect ratio at whatever size the renderer set the backing store to,
       so the HUD's right-hand panels always stay inside the visible picture and are never cropped. */
    #game {
      display: block;
      width: auto;
      height: auto;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 72px);
      object-fit: contain;
      background: var(--backdrop);
      border: 1px solid var(--edge);
      border-radius: 6px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      outline: none;
      touch-action: none;
    }

    #game:focus-visible {
      border-color: rgba(242, 199, 92, 0.7);
    }

    /* The status line under the frame: one sentence of narration for the last thing that happened.
       It is the accessible twin of the on-canvas toast, so it is announced politely. */
    #status {
      max-width: min(100vw - 32px, 980px);
      min-height: 1.2em;
      margin: 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* The fallback text inside the canvas is for browsers and readers that cannot paint it. */
    #game .fallback {
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <canvas
    id="game"
    width="1280"
    height="720"
    tabindex="0"
    role="img"
    aria-label="Solmar game view: an open-world 2D city by the sea. Use W A S D to walk or drive, Shift to run, Space for the handbrake, E to get in or out of a car, and Escape to pause."
  >
    <p class="fallback">Solmar needs a browser with HTML canvas support to draw the city.</p>
  </canvas>

  <p id="status" role="status" aria-live="polite" aria-atomic="true">Solmar. Press Enter to start.</p>

  <noscript>
    <p style="color: #a9b3b8; font-family: system-ui, sans-serif; text-align: center;">
      Solmar is a JavaScript game: please enable JavaScript to play.
    </p>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
